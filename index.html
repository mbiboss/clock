    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
    <div id="clock-container">
        <div id="time-display">
            <div class="digit-group" id="hours">
                <div class="flip-digit" data-digit="0">
                    <div class="digit-static">0</div>
                    <div class="digit-top"><span>0</span></div>
                    <div class="digit-bottom"><span>0</span></div>
                    <div class="digit-flip-top"><span>0</span></div>
                    <div class="digit-flip-bottom"><span>0</span></div>
                </div>
                <div class="flip-digit" data-digit="0">
                    <div class="digit-static">0</div>
                    <div class="digit-top"><span>0</span></div>
                    <div class="digit-bottom"><span>0</span></div>
                    <div class="digit-flip-top"><span>0</span></div>
                    <div class="digit-flip-bottom"><span>0</span></div>
                </div>
            </div>
            
            <div class="colon">:</div>
            
            <div class="digit-group" id="minutes">
                <div class="flip-digit" data-digit="0">
                    <div class="digit-static">0</div>
                    <div class="digit-top"><span>0</span></div>
                    <div class="digit-bottom"><span>0</span></div>
                    <div class="digit-flip-top"><span>0</span></div>
                    <div class="digit-flip-bottom"><span>0</span></div>
                </div>
                <div class="flip-digit" data-digit="0">
                    <div class="digit-static">0</div>
                    <div class="digit-top"><span>0</span></div>
                    <div class="digit-bottom"><span>0</span></div>
                    <div class="digit-flip-top"><span>0</span></div>
                    <div class="digit-flip-bottom"><span>0</span></div>
                </div>
            </div>
            
            <div class="colon">:</div>
            
            <div class="digit-group" id="seconds">
                <div class="flip-digit" data-digit="0">
                    <div class="digit-static">0</div>
                    <div class="digit-top"><span>0</span></div>
                    <div class="digit-bottom"><span>0</span></div>
                    <div class="digit-flip-top"><span>0</span></div>
                    <div class="digit-flip-bottom"><span>0</span></div>
                </div>
                <div class="flip-digit" data-digit="0">
                    <div class="digit-static">0</div>
                    <div class="digit-top"><span>0</span></div>
                    <div class="digit-bottom"><span>0</span></div>
                    <div class="digit-flip-top"><span>0</span></div>
                    <div class="digit-flip-bottom"><span>0</span></div>
                </div>
            </div>
            
            <div id="ampm">AM</div>
        </div>
        
        <div id="date-display">Monday, 1 January 2024</div>
    </div>
    
    <div id="wake-lock-indicator"></div>
    
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed'));
        }
        
        // Clock State
        let previousTime = { h1: '0', h2: '0', m1: '0', m2: '0', s1: '0', s2: '0' };
        let wakeLock = null;
        let isFullscreen = false;
        
        // DOM Elements
        const hoursDigits = document.querySelectorAll('#hours .flip-digit');
        const minutesDigits = document.querySelectorAll('#minutes .flip-digit');
        const secondsDigits = document.querySelectorAll('#seconds .flip-digit');
        const ampmElement = document.getElementById('ampm');
        const dateElement = document.getElementById('date-display');
        const wakeLockIndicator = document.getElementById('wake-lock-indicator');
        
        // Day names
        const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        
        // Update digit with flip animation
        function updateDigit(digitElement, newValue) {
            const currentValue = digitElement.dataset.digit;
            if (currentValue === newValue) return;
            
            const staticEl = digitElement.querySelector('.digit-static');
            const topEl = digitElement.querySelector('.digit-top span');
            const bottomEl = digitElement.querySelector('.digit-bottom span');
            const flipTopEl = digitElement.querySelector('.digit-flip-top span');
            const flipBottomEl = digitElement.querySelector('.digit-flip-bottom span');
            
            // Set up flip animation
            flipTopEl.textContent = currentValue;
            flipBottomEl.textContent = newValue;
            topEl.textContent = currentValue;
            bottomEl.textContent = newValue;
            
            // Start animation
            digitElement.classList.add('flipping');
            
            // Update static value after animation
            setTimeout(() => {
                staticEl.textContent = newValue;
                topEl.textContent = newValue;
                bottomEl.textContent = newValue;
                flipTopEl.textContent = newValue;
                flipBottomEl.textContent = newValue;
                digitElement.classList.remove('flipping');
                digitElement.dataset.digit = newValue;
            }, 500);
        }
        
        // Update clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            // AM/PM
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            
            // Format digits with leading zero
            const hStr = hours < 10 ? '0' + hours : hours.toString();
            const mStr = minutes < 10 ? '0' + minutes : minutes.toString();
            const sStr = seconds < 10 ? '0' + seconds : seconds.toString();
            
            // Update digits
            updateDigit(hoursDigits[0], hStr[0]);
            updateDigit(hoursDigits[1], hStr[1]);
            updateDigit(minutesDigits[0], mStr[0]);
            updateDigit(minutesDigits[1], mStr[1]);
            updateDigit(secondsDigits[0], sStr[0]);
            updateDigit(secondsDigits[1], sStr[1]);
            
            // Update AM/PM
            if (ampmElement.textContent !== ampm) {
                ampmElement.textContent = ampm;
            }
            
            // Update date
            const dayName = dayNames[now.getDay()];
            const date = now.getDate();
            const monthName = monthNames[now.getMonth()];
            const year = now.getFullYear();
            const dateString = `${dayName}, ${date} ${monthName} ${year}`;
            
            if (dateElement.textContent !== dateString) {
                dateElement.textContent = dateString;
            }
        }
        
        // Request Wake Lock
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLockIndicator.classList.add('active');
                    
                    wakeLock.addEventListener('release', () => {
                        wakeLockIndicator.classList.remove('active');
                        wakeLock = null;
                    });
                } catch (err) {
                    console.log('Wake Lock request failed');
                }
            }
        }
        
        // Re-request wake lock on visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && wakeLock === null) {
                requestWakeLock();
            }
        });
        
        // Fullscreen functions
        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
            isFullscreen = true;
        }
        
        // Request fullscreen and wake lock on first interaction
        function handleFirstInteraction() {
            if (!isFullscreen) {
                enterFullscreen();
            }
            requestWakeLock();
            document.removeEventListener('click', handleFirstInteraction);
            document.removeEventListener('touchstart', handleFirstInteraction);
            document.removeEventListener('keydown', handleFirstInteraction);
        }
        
        document.addEventListener('click', handleFirstInteraction);
        document.addEventListener('touchstart', handleFirstInteraction);
        document.addEventListener('keydown', handleFirstInteraction);
        
        // Prevent scrolling
        document.addEventListener('wheel', e => e.preventDefault(), { passive: false });
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('gesturechange', e => e.preventDefault());
        document.addEventListener('gestureend', e => e.preventDefault());
        
        // Prevent context menu
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // Initialize clock
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
