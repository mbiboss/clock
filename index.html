<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Flip Clock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
    <div class="clock-container">
        <div class="clock-wrapper">
            <div class="time-row">
                <div class="time-group" id="hours-group"></div>
                <div class="colon"></div>
                <div class="time-group" id="minutes-group"></div>
                <div class="colon"></div>
                <div class="time-group" id="seconds-group"></div>
                <div class="ampm-box">
                    <span id="ampm">AM</span>
                </div>
            </div>
            <div class="date-row" id="date-display"></div>
        </div>
    </div>

    <!-- Install Popup Modal -->
    <div class="install-modal" id="install-modal">
        <div class="install-content">
            <h3>Install Flip Clock</h3>
            <p>Add this app to your device for a fullscreen, offline experience.</p>
            <div class="install-actions">
                <button id="btn-cancel" class="btn btn-cancel">Cancel</button>
                <button id="btn-install" class="btn btn-install">Install Clock</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then(reg => {
            console.log('SW registered: ', reg.scope);
          }).catch(err => console.log('SW registration failed: ', err));
        });
      }
    </script>
</body>
</html>
